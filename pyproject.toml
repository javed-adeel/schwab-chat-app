[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newschat"
version = "0.1.0"
description = "Grounded chat over recent financial news: hybrid retrieval + cited answers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
openrouter = ["openai>=1.40"]
llm = ["anthropic>=0.40", "google-genai>=1.0", "openai>=1.40"]
dev = [
    "anthropic>=0.40",
    "google-genai>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
newschat = "newschat.__main__:main"
newschat-eval = "newschat.evaluation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/newschat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=newschat --cov-report=term-missing:skip-covered --cov-fail-under=90"
markers = [
    "eval: retrieval-quality regression tests against the golden set",
]

[tool.coverage.run]
branch = true
source = ["newschat"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # curly quotes are legitimate in news text
    "SIM905",  # multi-line stopword literals are more readable than list syntax
]

[tool.ruff.lint.per-file-ignores]
# Compound one-line asserts state an invariant compactly; splitting them hurts readability.
"tests/**" = ["B011", "PT018", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "snowballstemmer.*", "anthropic.*", "google.genai.*", "openai.*"]
ignore_missing_imports = true
